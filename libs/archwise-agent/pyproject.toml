[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[project]
name = "archwise-agent"
version = "0.1.0"
description = "Initial agent runtime for ArchWise"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "deepagents>=0.7,<0.8",
  "langchain>=1.0,<2.0",
  "langchain-core>=1.0,<2.0",
  "langchain-openrouter>=0.2.8,<0.3.0",
  "fastapi[standard]>=0.115,<1.0",
  "langgraph>=1.0,<2.0",
  "langgraph-checkpoint-sqlite>=3.1.1,<4.0",
  "agent-stream-py>=0.1,<0.2",
  "pydantic-settings>=2.0,<3.0",
  "python-dotenv>=1.0,<2.0",
]

[project.scripts]
archwise-workflow-diagram = "archwise_agent.cli.workflow_diagram:main"

[project.optional-dependencies]
research = [
  "tavily-python>=0.8,<1.0",
]
observability = [
  "langfuse>=4.15.1",
  "langsmith>=0.2,<1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.9,<1.0",
]

[tool.uv.sources]
agent-stream-py = { path = "../../libs/agent-stream-py", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/archwise_agent"]

[tool.fastapi]
entrypoint = "archwise_agent.backend.app:app"

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
