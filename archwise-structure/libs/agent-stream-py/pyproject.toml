[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[project]
name = "agent-stream-py"
version = "0.1.0"
description = "ArchWise agent stream protocol models for Python"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0,<3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_stream_py"]
