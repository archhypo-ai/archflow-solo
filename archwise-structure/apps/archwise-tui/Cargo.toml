[package]
name = "archwise-tui"
version = "0.1.0"
edition = "2021"
description = "Minimal Ratatui client for the ArchWise local backend"
build = "build.rs"

[dependencies]
agent-stream-rust = { path = "../../libs/agent-stream-rust" }
color-eyre = "0.6.5"
crossterm = "0.29.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "default-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
tui-markdown = "0.3.9"
unicode-width = "0.2.2"
uuid = { version = "1.26.1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
